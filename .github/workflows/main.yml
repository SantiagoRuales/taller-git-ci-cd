name: CI/CD con despliegue en GitHub Pages

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Integración Continua (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Verificar archivos requeridos
        run: |
          if [ -f "home.html" ] && [ -f "styles.css" ]; then
            echo "✅ Archivos existen: home.html y styles.css"
          else
            echo "❌ Faltan archivos requeridos" && exit 1
          fi

  deploy:
    name: Despliegue Continuo (CD)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
